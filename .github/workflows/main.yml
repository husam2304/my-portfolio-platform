name: Deploy to MonsterASP.NET

on:
  push:
    branches:
      - backend

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # Checkout
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # Setup .NET
      # ==============================
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'


      # ==============================
      # Restore
      # ==============================
      - name: Restore
        run: dotnet restore './Portfolio.API.csproj'


      # ==============================
      # Build
      # ==============================
      - name: Build
        run: dotnet build './Portfolio.API.csproj' -c Release --no-restore


      # ==============================
      # Publish
      # ==============================
      - name: Publish
        run: dotnet publish './Portfolio.API.csproj' -c Release -o publish


      # ==============================
      # Remove frontend files
      # ==============================
      - name: Remove frontend files
        run: |
          rm -rf publish/wwwroot
          rm -f publish/web.config


      # ==============================
      # Install lftp
      # ==============================
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp


      # ==============================
      # Create app_offline.htm
      # ==============================
      - name: Create app_offline.htm
        run: |
          cat > app_offline.htm <<'EOF'
          <html>
          <head>
            <title>Maintenance</title>
          </head>
          <body>
            <h2>Maintenance in progress...</h2>
          </body>
          </html>
          EOF


      # ==============================
      # Upload app_offline.htm
      # ==============================
      - name: Upload app_offline.htm
        run: |
          lftp -c "
            set ftp:ssl-force false;
            set ftp:ssl-protect-data false;
            set ssl:verify-certificate false;
            open ftp://${{ secrets.FTP_SERVER }};
            user '${{ secrets.FTP_USERNAME }}' '${{ secrets.FTP_PASSWORD }}';
            put app_offline.htm -o /wwwroot/app_offline.htm;
            bye
          "


      # ==============================
      # Wait for IIS
      # ==============================
      - name: Wait for application shutdown
        run: |
          echo "Waiting for IIS..."
          sleep 30


      # ==============================
      # Deploy
      # ==============================
      - name: Deploy to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftp
          port: 21

          local-dir: publish/
          server-dir: /wwwroot/

          dangerous-clean-slate: false


      # ==============================
      # Remove app_offline.htm
      # ==============================
      - name: Remove app_offline.htm
        run: |
          lftp -c "
            set ftp:ssl-force false;
            set ftp:ssl-protect-data false;
            set ssl:verify-certificate false;
            open ftp://${{ secrets.FTP_SERVER }};
            user '${{ secrets.FTP_USERNAME }}' '${{ secrets.FTP_PASSWORD }}';
            rm -f /wwwroot/app_offline.htm;
            bye
          "


      # ==============================
      # Done
      # ==============================
      - name: Done
        run: echo "Deployment completed successfully"
